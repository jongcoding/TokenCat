name: Release Windows

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish Windows release
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: npm

      - name: Validate tag, versions, and main ancestry
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must use the vX.Y.Z format."
          }

          $packageVersion = node -p "require('./package.json').version"
          $lockVersion = node -p "require('./package-lock.json').version"
          $lockRootVersion = node -p "require('./package-lock.json').packages[''].version"

          if ($env:RELEASE_TAG -ne "v$packageVersion") {
            throw "The tag does not match package.json."
          }
          if ($packageVersion -ne $lockVersion -or $packageVersion -ne $lockRootVersion) {
            throw "package.json and package-lock.json versions do not match."
          }

          git fetch --no-tags origin main:refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "Could not fetch origin/main."
          }

          git merge-base --is-ancestor $env:GITHUB_SHA refs/remotes/origin/main
          if ($LASTEXITCODE -ne 0) {
            throw "The tagged commit must be contained in origin/main."
          }

      - name: Install locked dependencies
        run: npm ci

      - name: Check Electron sources
        run: npm run check:electron

      - name: Run tests
        run: npm test

      - name: Build renderer
        run: npm run build

      - name: Build and upload draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: npm run release:win

      - name: Verify assets and publish release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $packageVersion = node -p "require('./package.json').version"
          $setupName = "TokenCat-Setup-$packageVersion-Windows.exe"
          $portableName = "TokenCat-Portable-$packageVersion-Windows.exe"
          $requiredAssets = @(
            $setupName,
            "$setupName.blockmap",
            $portableName,
            "latest.yml"
          )

          $localAssetSizes = @{}
          $localAssetSha256 = @{}
          foreach ($assetName in $requiredAssets) {
            $assetPath = Join-Path "release" $assetName
            if (-not (Test-Path -LiteralPath $assetPath -PathType Leaf)) {
              throw "Missing local release asset: $assetName"
            }
            $localAssetSizes[$assetName] = [int64](Get-Item -LiteralPath $assetPath).Length
            if ($localAssetSizes[$assetName] -le 0) {
              throw "Local release asset is empty: $assetName"
            }
            $localAssetSha256[$assetName] = (
              Get-FileHash -LiteralPath $assetPath -Algorithm SHA256
            ).Hash.ToLowerInvariant()
          }

          $latestPath = Join-Path "release" "latest.yml"
          $latestJson = node -e "const fs=require('node:fs'); const yaml=require('js-yaml'); process.stdout.write(JSON.stringify(yaml.load(fs.readFileSync(process.argv[1], 'utf8'))));" $latestPath
          if ($LASTEXITCODE -ne 0) {
            throw "Could not parse latest.yml."
          }
          $latestInfo = $latestJson | ConvertFrom-Json

          if ([string]$latestInfo.version -cne $packageVersion) {
            throw "latest.yml does not contain the release version."
          }
          if ([string]$latestInfo.path -cne $setupName) {
            throw "latest.yml does not point to the NSIS installer."
          }

          $updateFiles = @($latestInfo.files)
          if ($updateFiles.Count -ne 1) {
            throw "latest.yml must contain exactly one update file."
          }
          $setupInfo = $updateFiles[0]
          if ([string]$setupInfo.url -cne $setupName) {
            throw "The first latest.yml update file must be the NSIS installer."
          }

          $setupPath = Join-Path "release" $setupName
          $setupStream = $null
          $sha512 = $null
          try {
            $setupStream = [IO.File]::OpenRead($setupPath)
            $sha512 = [Security.Cryptography.SHA512]::Create()
            $localSetupSha512 = [Convert]::ToBase64String(
              $sha512.ComputeHash($setupStream)
            )
          } finally {
            if ($null -ne $sha512) {
              $sha512.Dispose()
            }
            if ($null -ne $setupStream) {
              $setupStream.Dispose()
            }
          }

          if (
            [string]$setupInfo.sha512 -cne $localSetupSha512 -or
            [string]$latestInfo.sha512 -cne $localSetupSha512
          ) {
            throw "latest.yml SHA-512 does not match the local NSIS installer."
          }
          if ([int64]$setupInfo.size -ne $localAssetSizes[$setupName]) {
            throw "latest.yml size does not match the local NSIS installer."
          }

          $release = gh release view $env:RELEASE_TAG --json isDraft,isPrerelease,assets |
            ConvertFrom-Json
          if ($LASTEXITCODE -ne 0) {
            throw "Could not read the GitHub draft release."
          }
          if (-not $release.isDraft -or $release.isPrerelease) {
            throw "The GitHub release must remain a non-prerelease draft until verification completes."
          }

          $remoteAssetsByName = @{}
          foreach ($remoteAsset in @($release.assets)) {
            if ($remoteAssetsByName.ContainsKey([string]$remoteAsset.name)) {
              throw "Duplicate GitHub release asset: $($remoteAsset.name)"
            }
            $remoteAssetsByName[[string]$remoteAsset.name] = $remoteAsset
          }

          foreach ($assetName in $requiredAssets) {
            if (-not $remoteAssetsByName.ContainsKey($assetName)) {
              throw "Missing GitHub release asset: $assetName"
            }
            $remoteAsset = $remoteAssetsByName[$assetName]
            if ([string]$remoteAsset.name -cne $assetName) {
              throw "GitHub release asset name casing does not match: $assetName"
            }
            if ([string]$remoteAsset.state -cne "uploaded") {
              throw "GitHub release asset is not fully uploaded: $assetName"
            }
            if ([int64]$remoteAsset.size -ne $localAssetSizes[$assetName]) {
              throw "GitHub release asset size does not match the local file: $assetName"
            }
            $expectedDigest = "sha256:$($localAssetSha256[$assetName])"
            if ([string]$remoteAsset.digest -cne $expectedDigest) {
              throw "GitHub release asset SHA-256 digest does not match the local file: $assetName"
            }
          }

          gh release edit $env:RELEASE_TAG `
            --verify-tag `
            --draft=false `
            --latest `
            --title "TokenCat $env:RELEASE_TAG"
          if ($LASTEXITCODE -ne 0) {
            throw "Could not publish the verified GitHub release."
          }
